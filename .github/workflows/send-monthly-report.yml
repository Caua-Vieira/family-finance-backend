name: Send Monthly Report

on:
  schedule:
    - cron: '0 11 1 * *'  # todo dia 1º do mês, 08:00 no horário de Brasília (UTC-3)
  workflow_dispatch:  # permite disparar manualmente pelo GitHub

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Chama endpoint de envio do resumo mensal
        run: |
          response=$(curl -s -o /tmp/response.json -w "%{http_code}" -X POST \
            https://family-finance-backend-cbcq.onrender.com/api/reports/monthly-summary \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")

          echo "Status: $response"
          cat /tmp/response.json

          if [ "$response" -ge 400 ]; then
            echo "Falha ao enviar resumo mensal"
            exit 1
          fi
